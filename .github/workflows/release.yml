name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches manifest.json and package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            echo "Error: Obsidian plugin release tags must NOT have a 'v' prefix (got $TAG)"
            exit 1
          fi
          MANIFEST_VER=$(node -p "require('./manifest.json').version")
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "$MANIFEST_VER" || "$TAG" != "$PKG_VER" ]]; then
            echo "Error: Version mismatch (tag=$TAG, manifest=$MANIFEST_VER, package=$PKG_VER)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Obsidian review rules)
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Build plugin bundle
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
